<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI — Design v3</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/v3.css?v=20260815e">
</head>
<body>
<div id="app"></div>
<script src="js/shared.js?v=20260815e"></script>
<script src="js/v3-data.js?v=20260815e"></script>
<script src="js/v3.js?v=20260815e"></script>
<script>
V3.boot({deck:{sys:'ai',context:'Six metrics · five risk thresholds · five milestones'}});
var A=V3DATA.ai;

var KPI_ORDER=['alignment','transparency','safety','compute','autonomy','trust'];
V3.systemPage({
  sys:'ai',
  tagline:'The technology that audits itself — or doesn’t.',
  lead:'Six measures of whether AI stays accountable to the people it affects: alignment, transparency, safety coverage, compute governance, autonomy limits, and public trust. The divergence between futures is starker here than in any other system — and below the charts, five thresholds mark where recoverable drift becomes structural failure.',
  today:48,
  proj:{aggressive:92,moderate:68,bau:32,worst:10},
  metrics:KPI_ORDER.map(function(k){
    var m=A.KPI[k];
    return {label:m.label,unit:m.unit,dir:m.dir,notes:m.notes,
      data:{aggressive:m.aggressive,moderate:m.moderate,bau:m.bau,worst:m.worst}};
  }),
  narratives:A.NARRATIVES,
  crossKey:'ai'
});

/* ── risks + milestones, before the narrative ── */
var narSection=document.querySelector('#sys-nar').closest('.section');
narSection.insertAdjacentHTML('beforebegin',
  '<section class="section"><div class="col">'
  +'<div class="section-head"><div><h2 class="title-2">Five thresholds where drift becomes failure</h2>'
  +'<p class="lead">Each risk has a hard line. Above it, problems are correctable; below it, the feedback loops flip and correction costs grow exponentially. Values are the chosen future’s 2050 outcome.</p></div></div>'
  +'<div id="risks"></div></div></section>'
  +'<section class="section"><div class="col">'
  +'<div class="section-head"><div><h2 class="title-2">The governance milestones</h2>'
  +'<p class="lead">Five dated checkpoints from baseline assessment to mature governance — what has to be true by when, and whether the chosen future gets there.</p></div></div>'
  +'<div id="milestones" style="max-width:680px"></div></div></section>');

V3.thresholds('#risks',A.RISKS.map(function(r){
  var series=A.KPI[r.field];
  return {label:r.label,
    thresholdText:'breach below '+r.threshold+(series.unit==='%'?'%':''),
    desc:r.desc,scenarioNote:r.scenarioNote,
    value:function(sc){var d=series[sc];return d[d.length-1]},
    fmt:function(v){return Math.round(v)+(series.unit==='%'?'%':'')},
    breach:function(v){return v<r.threshold},
    near:function(v){return v<r.threshold*1.35}};
}));
V3.milestones('#milestones',A.MILESTONES);
</script>
</body>
</html>
