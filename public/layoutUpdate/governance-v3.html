<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Governance — Design v3</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/v3.css?v=20260815d">
</head>
<body>
<div id="app"></div>
<script src="js/shared.js?v=20260815d"></script>
<script src="js/v3-data.js?v=20260815d"></script>
<script src="js/v3.js?v=20260815d"></script>
<script>
V3.boot({deck:{sys:'governance',context:'Charter, assemblies, modules, audits'}});
var G=V3DATA.governance;

V3.systemPage({
  sys:'governance',
  tagline:'Trust is infrastructure.',
  lead:'Civic participation and institutional trust from 2026 to 2050 — plus the machinery underneath them: an AI charter, five citizen assemblies, five deployable governance modules, and a safety-audit program. Every other system in the model is only as strong as what’s on this page.',
  today:40,
  proj:G.GOV_SCORES,
  metrics:VIZ_METRICS.governance,
  narratives:{
    aggressive:'Participatory budgeting, open audits, and citizen assemblies rebuild the machinery in public view. Participation reaches 82%, trust 80% — not because institutions are loved, but because they are legible and answerable.',
    moderate:'Reform where the pressure is highest, inertia elsewhere. Trust climbs to 55% — institutions are no longer actively distrusted, which turns out to be enough for most policy to function. Fragile, but functioning.',
    bau:'Participation flatlines at 15%. Trust decays to 26% as institutions announce reforms, partially fund them, and quietly abandon them. Every crisis is managed; none is prevented.',
    worst:'Trust collapses below 20% and stays there. Emergency powers become permanent, elections become rituals, and governance capacity is consumed entirely by crisis response.'
  },
  crossKey:'governance'
});

var narSection=document.querySelector('#sys-nar').closest('.section');
narSection.insertAdjacentHTML('beforebegin',
  /* charter + pillars */
  '<section class="section"><div class="col">'
  +'<div class="section-head"><div><h2 class="title-2">The AI charter</h2>'
  +'<p class="lead">The binding agreement that makes every other module enforceable — its status is the single strongest predictor of the 2050 score.</p></div></div>'
  +'<div class="narrative" style="margin-bottom:40px"><div class="who" id="charter-who"></div><p id="charter-status"></p></div>'
  +'<div class="trio" id="pillars"></div></div></section>'
  /* participation + funding */
  +'<section class="section"><div class="col">'
  +'<div class="section-head"><div><h2 class="title-2">Who shows up, who pays</h2>'
  +'<p class="lead">Participation vitals under the chosen future, and where governance funding actually comes from.</p></div></div>'
  +'<div class="kpis" id="part-tiles" style="margin-bottom:40px"></div>'
  +'<div id="fund-stack" style="max-width:640px"></div></div></section>'
  /* assemblies */
  +'<section class="section"><div class="col">'
  +'<div class="section-head"><div><h2 class="title-2">Five citizen assemblies</h2>'
  +'<p class="lead">Randomly selected, professionally staffed, with real teeth — the share of their decisions that bind is the number to watch.</p></div></div>'
  +'<div class="impacts" id="assemblies"></div></div></section>'
  /* modules */
  +'<section class="section"><div class="col">'
  +'<div class="section-head"><div><h2 class="title-2">Five governance modules</h2>'
  +'<p class="lead">Deployable civic software — representation, budgeting, audits, transparency, oversight — each shipping (or not) depending on the future.</p></div></div>'
  +'<div class="chart-grid" id="modules"></div></div></section>'
  /* audit program */
  +'<section class="section"><div class="col">'
  +'<div class="section-head"><div><h2 class="title-2">The safety-audit program</h2>'
  +'<p class="lead">Share of deployed AI systems independently audited each year, and what the auditors find. Coverage is the leading indicator; unresolved incidents are the lagging cost.</p></div></div>'
  +'<div class="chart-grid"><div class="chart-card" id="audit-chart"></div><div class="chart-card" id="audit-tiles" style="border:none;padding:0"><div class="kpis" style="grid-template-columns:1fr 1fr" id="audit-kpis"></div></div></div>'
  +'</div></section>');

/* charter + pillars */
function renderCharter(animate){
  var act=V3.scenario.get(),m=V3.SC[act];
  document.getElementById('charter-who').textContent=m.name+' · charter status';
  document.getElementById('charter-status').textContent=G.CHARTER_STATUS[act];
  if(animate)V3.stagger(document.querySelectorAll('#pillars .t-card'),40);
}
document.getElementById('pillars').innerHTML=G.PILLARS.map(function(p){
  return '<div class="t-card" style="cursor:default"><h3 style="color:'+p.color+'">'+p.name+'</h3>'
    +'<p>'+p.desc+'</p>'
    +'<p style="margin-top:12px;padding-top:12px;border-top:1px solid var(--hairline);color:var(--ink-2);font-size:12.5px">“'+p.principle+'”</p></div>';
}).join('');

/* participation tiles */
function renderParticipation(animate){
  var act=V3.scenario.get(),m=V3.SC[act];
  document.getElementById('part-tiles').innerHTML=G.PARTICIPATION[act].map(function(p){
    return '<div class="stat"><div class="lbl">'+p.label+'</div>'
      +'<div class="val" style="color:'+m.color+'">'+p.value+'</div>'
      +'<div class="delta flat"><span class="ctx">'+p.note+'</span></div></div>';
  }).join('');
  if(animate)V3.stagger(document.querySelectorAll('#part-tiles .stat'),28);
}
V3.stack('#fund-stack',function(sc){return G.FUNDING_STACK[sc]});

/* assemblies board */
function renderAssemblies(animate){
  var act=V3.scenario.get();
  var TONE={Active:'good',Limited:'warn',Advisory:'warn',Dissolved:'bad',Suspended:'bad','Not formed':'bad'};
  document.getElementById('assemblies').innerHTML=G.ASSEMBLIES.map(function(a){
    var s=a[act];
    return '<div class="impact-row" style="grid-template-columns:150px 110px 1fr">'
      +'<span class="t"><i style="background:'+a.color+'"></i>'+a.name+'</span>'
      +'<span class="th-state num '+(TONE[s.status]||'warn')+'" style="justify-self:start">'+s.status.toUpperCase()+'</span>'
      +'<span class="e num" style="font-size:12px">'+s.members+' members · '+s.turnout+'% turnout · '+s.binding+'% of decisions binding · '+s.meetings+' meetings/yr</span></div>';
  }).join('');
  if(animate)V3.stagger(document.querySelectorAll('#assemblies .impact-row'),26);
}

/* modules board */
function renderModules(animate){
  var act=V3.scenario.get();
  var TONE={GA:'good',Beta:'warn',Alpha:'warn','Not deployed':'bad'};
  document.getElementById('modules').innerHTML=G.MODULES.map(function(mod){
    var s=mod[act];
    return '<div class="chart-card"><div class="c-head">'
      +'<span class="c-title" style="color:'+mod.color+'">'+mod.name+'</span>'
      +'<span class="th-state num '+(TONE[s.status]||'warn')+'">'+s.status.toUpperCase()+(s.version?' · '+s.version:'')+'</span></div>'
      +'<div style="display:flex;gap:22px;margin:12px 0 10px">'+ (s.metrics||[]).map(function(mt){
        return '<div><b class="num" style="font-size:16px;font-weight:700">'+mt.v+'</b><div style="font-size:10.5px;color:var(--ink-4)">'+mt.l+'</div></div>';
      }).join('')+'</div>'
      +'<div class="ms-items" style="margin-top:6px">'+(s.features||[]).map(function(f){return '<span>'+f+'</span>'}).join('')+'</div></div>';
  }).join('');
  if(animate)V3.stagger(document.querySelectorAll('#modules .chart-card'),30);
}

/* audit chart + tiles */
var auditPct={};V3.SC_ORDER.forEach(function(sc){auditPct[sc]=G.AUDIT[sc].map(function(r){return r.pct})});
var auditYears=[];for(var y=2026;y<=2050;y++)auditYears.push(y);
V3.traj('#audit-chart',{label:'Audit coverage',unit:'%',dec:0,dir:'higher',years:auditYears,data:auditPct,
  notes:{aggressive:'Universal coverage by the late 2030s: every deployed system audited annually, findings public, incidents resolved in-cycle.',
    moderate:'Coverage climbs past half of deployed systems. The audited half behaves; the unaudited half is where the incidents live.',
    bau:'Coverage stalls near a quarter. Auditing depends on volunteer compliance, and the systems most likely to fail are least likely to volunteer.',
    worst:'The audit program is dismantled. What isn’t measured can’t be governed — which is the point.'}});
function renderAuditTiles(animate){
  var act=V3.scenario.get(),m=V3.SC[act];
  var last=G.AUDIT[act][G.AUDIT[act].length-1];
  var open=last.incidents-last.resolved;
  document.getElementById('audit-kpis').innerHTML=[
    {l:'Systems audited · 2050',v:last.audited+'<small> of '+last.total+'</small>',c:'flat',ctx:'independent annual review'},
    {l:'Coverage',v:last.pct+'<small>%</small>',c:last.pct>=60?'good':last.pct>=35?'flat':'bad',ctx:'of all deployed AI systems'},
    {l:'Incidents found · 2050',v:String(last.incidents),c:'flat',ctx:'safety findings requiring action'},
    {l:'Left unresolved',v:String(open),c:open<=2?'good':open<=10?'flat':'bad',ctx:'the debt that compounds into failures'}
  ].map(function(x){
    return '<div class="stat"><div class="lbl">'+x.l+'</div>'
      +'<div class="val" style="color:'+m.color+'">'+x.v+'</div>'
      +'<div class="delta '+x.c+'"><span class="ctx">'+x.ctx+'</span></div></div>';
  }).join('');
  if(animate)V3.stagger(document.querySelectorAll('#audit-kpis .stat'),26);
}

function paintAll(animate){
  renderCharter(animate);renderParticipation(animate);
  renderAssemblies(animate);renderModules(animate);renderAuditTiles(animate);
}
paintAll(false);
V3.scenario.onChange(function(){paintAll(true)});
</script>
</body>
</html>
