<body>
<div id="app"></div>
<script src="js/shared.js?v=20260831a"></script>
<script src="js/v3-data.js?v=20260831a"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@12.23.26/dist/motion.js"></script>
<script src="js/v3.js?v=20260831a"></script>
<script>
V3.boot({deck:{sys:'civilization',context:'The composite — health, funding, milestones'}});
var CV=V3DATA.civilization;

var KPI_META={
  poverty:{dec:1},reskill:{dec:0},emissions:{dec:1},biodiversity:{dec:0},charter:{dec:0}
};
V3.systemPage({
  sys:'civilization',
  tagline:'The number the other five add up to.',
  lead:'The composite in depth: the site’s headline score decomposed into the cross-cutting KPIs that drive it, the funding architecture that pays for the response, and eight dated milestones between here and 2050.',
  today:44,
  proj:{aggressive:81,moderate:61,bau:30,worst:13},
  metrics:Object.keys(CV.KPI).map(function(k){
    var m=CV.KPI[k];
    var ann=CV.KPI_ANNOTATIONS[k];
    return {label:m.label,unit:m.unit,dir:m.dir,dec:KPI_META[k]?KPI_META[k].dec:null,
      notes:ann?{aggressive:ann,moderate:ann,bau:ann,worst:ann}:null,
      data:{aggressive:m.aggressive,moderate:m.moderate,bau:m.bau,worst:m.worst}};
  }),
  narratives:{
    aggressive:'Health 81, equity 81 — the curves converge upward as the feedback loops turn virtuous: trust funds reform, reform funds resilience, resilience earns trust. A generation grows up assuming systems mostly work.',
    moderate:'Health 61, equity 58. Real improvement, unevenly distributed — the composite hides a gap between regions that modernized and regions that were promised modernization.',
    bau:'Health 30, equity 24. No single catastrophe — just compounding erosion, each system passing its weakness to the next. The decline becomes self-reinforcing around 2040.',
    worst:'Health 13, equity 9. The loops run in reverse: climate failure breaks work, broken work breaks trust, broken trust breaks every response.'
  },
  crossKey:'civilization'
});

var narSection=document.querySelector('#sys-nar').closest('.section');
narSection.insertAdjacentHTML('beforebegin',
  /* the six domains */
  '<section class="section"><div class="col">'
  +'<div class="section-head"><div><h2 class="title-2">Six domains, one composite</h2>'
  +'<p class="lead">Each domain scored today and where the chosen future lands it — the weighting that produces the headline number.</p></div></div>'
  +'<div id="domain-landing"></div></div></section>'
  /* funding */
  +'<section class="section"><div class="col">'
  +'<div class="section-head"><div><h2 class="title-2">Who pays for the response</h2>'
  +'<p class="lead">The civic funding pool under the chosen future — its size, its reach, and where the money comes from. Ambition without a funding stack is a press release.</p></div></div>'
  +'<div class="kpis" id="fund-tiles" style="margin-bottom:40px"></div>'
  +'<div id="fund-stack" style="max-width:640px"></div></div></section>'
  /* milestones */
  +'<section class="section"><div class="col">'
  +'<div class="section-head"><div><h2 class="title-2">Eight milestones to 2050</h2>'
  +'<p class="lead">The full run of checkpoints — what has to be true by when, and whether the chosen future clears each bar.</p></div></div>'
  +'<div id="milestones" style="max-width:680px"></div></div></section>');

/* domains landing */
var domRows=CV.DOMAINS.map(function(d,i){
  var proj={};V3.SC_ORDER.forEach(function(sc){proj[sc]=CV.PROJECTED[sc][i]});
  var all=[d.today];V3.SC_ORDER.forEach(function(sc){all.push(proj[sc])});
  var lo=Math.min.apply(null,all),hi=Math.max.apply(null,all),pad=(hi-lo)*.09||1;
  return {label:d.name,sub:'/100',today:d.today,proj:proj,unit:'',dir:'higher',min:lo-pad,max:hi+pad,dec:0};
});
V3.landing('#domain-landing',domRows);

/* funding tiles + stack */
function renderFunding(animate){
  var act=V3.scenario.get(),m=V3.SC[act],f=CV.FUNDING[act];
  document.getElementById('fund-tiles').innerHTML=[
    {l:'Civic funding pool',v:f.pool,ctx:'annual, all sources combined'},
    {l:'Per-person dividend',v:f.yr,ctx:f.bw+' — the income floor under the transition'},
    {l:'People covered',v:f.pop,ctx:'receiving the dividend by 2050'},
    {l:'Escalation path',v:f.esc,ctx:'how the pool grows over the run'}
  ].map(function(x){
    return '<div class="stat"><div class="lbl">'+x.l+'</div>'
      +'<div class="val" style="color:'+m.color+';font-size:21px">'+x.v+'</div>'
      +'<div class="delta flat"><span class="ctx">'+x.ctx+'</span></div></div>';
  }).join('');
  if(animate)V3.stagger(document.querySelectorAll('#fund-tiles .stat'),28);
}
V3.stack('#fund-stack',function(sc){return CV.FUND_SOURCES[sc]});
V3.milestones('#milestones',CV.MILESTONES);

renderFunding(false);
V3.scenario.onChange(function(){renderFunding(true)});
</script>
</body>
</html>
