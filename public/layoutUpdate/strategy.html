<body>
<div id="app"></div>
<script src="js/shared.js?v=20260829c"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@12.23.26/dist/motion.js"></script>
<script src="js/v3.js?v=20260829c"></script>
<script>
V3.boot({deck:{sys:'strategy',context:'Twenty actions across three levels'}});
V3.systemPage({
  sys:'strategy',
  tagline:'Twenty levers anyone can pull.',
  lead:'The action catalog — concrete interventions at personal, organizational, and policy scale — and how far each future actually pulls them. The same list exists in every scenario; what changes is whether it stays a list.',
  today:35,
  proj:STRATEGY_CATALOG.scores,
  metrics:VIZ_METRICS.strategy,
  narratives:STRATEGY_CATALOG.narratives,
  crossKey:'strategy'
});

/* ── Catalog sections (page-specific) ── */
var main=document.querySelector('#app main');
main.insertAdjacentHTML('beforeend',
  '<section class="section"><div class="col">'
  +'<div class="section-head"><div><h2 class="title-2">Three levels of leverage</h2>'
  +'<p class="lead">Adoption under the chosen future, level by level. Meters are share of eligible actors who have taken the action.</p></div></div>'
  +'<div class="trio" id="cat-cards"></div></div></section>'
  +'<section class="section"><div class="col">'
  +'<div class="section-head"><div><h2 class="title-2">The catalog</h2>'
  +'<p class="lead">Every action, with its status under the chosen future — ordered by who can actually reach it. Statuses run from blocked to enforced; switch scenarios and watch the same list change meaning.</p>'
  +'<p class="epi-note"><span class="authored-tag">Authored</span> Scope tiers and the dependency links below are editorial judgement — not measurement, not model output. <b>No action in this catalog moves the composite score.</b> The four futures carry fixed trajectories and the catalog is not an input to them. What a national action can honestly claim is shown on its own card.</p></div>'
  +'<div class="filter-seg" id="cat-filter" role="group" aria-label="Scope"></div></div>'
  +'<div class="actions-grid" id="action-cards"></div></div></section>');

var CATS=STRATEGY_CATALOG.categories;
var CAT_COLORS={personal:'#4ecdc4',organization:'#5da5da',policy:'#9b87f5'};
var SCOPES=STRATEGY_CATALOG.scopes, LEVERS=STRATEGY_CATALOG.levers;
var filter='all';
/* page-local: which scope tier the reader had filtered to */
V3.share.config({tier:{get:function(){return filter==='all'?null:filter},
                       set:function(v){if(/^t[124]$/.test(v))filter=v}}});

/* flatten once; category is kept only for the colour dot */
var ALL=[];
CATS.forEach(function(c){STRATEGY_CATALOG.actions[c.key].forEach(function(a){ALL.push({cat:c.key,a:a})})});
function slug(n){return n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}
function scopeOf(t){for(var i=0;i<SCOPES.length;i++)if(SCOPES[i].tier===t)return SCOPES[i];return null}
function bySlug(sl){for(var i=0;i<ALL.length;i++)if(slug(ALL[i].a.name)===sl)return ALL[i].a;return null}

function renderCats(){
  var act=V3.scenario.get();
  document.getElementById('cat-cards').innerHTML=CATS.map(function(c){
    var s=STRATEGY_CATALOG.summaries[c.key][act];
    return '<div class="t-card" style="cursor:default">'
      +'<h3 style="color:'+CAT_COLORS[c.key]+'">'+c.label+'</h3>'
      +'<div class="meter-mount" data-cat="'+c.key+'" style="margin:12px 0 4px"></div>'
      +'<p style="min-height:56px">'+s.note+'</p>'
      +'<div class="a-meta" style="border-top:1px solid var(--hairline);margin-top:12px;padding-top:12px;display:flex;gap:14px;font-family:var(--font-mono);font-size:11px;color:var(--ink-4)">'
      +'<span>top <b style="color:var(--ink-3)">'+s.topImpact+'</b></span>'
      +'<span>impact <b style="color:var(--ink-3)">'+s.avgImpact+'</b></span></div></div>';
  }).join('');
  CATS.forEach(function(c){
    var s=STRATEGY_CATALOG.summaries[c.key][act];
    V3.meter(document.querySelector('.meter-mount[data-cat="'+c.key+'"]'),parseFloat(s.adoption)||0,s.adoption,CAT_COLORS[c.key]);
  });
}

/* the filter is an affordance, never pre-applied: the default orders
   reachable tiers first instead of hiding the national ones */
function renderFilter(){
  var opts=[{key:'all',label:'All \u00b7 reachable first'}].concat(SCOPES.map(function(sc){
    return {key:'t'+sc.tier,label:sc.label};
  }));
  document.getElementById('cat-filter').innerHTML=opts.map(function(o){
    return '<button data-f="'+o.key+'" aria-pressed="'+(filter===o.key)+'">'+o.label+'</button>';
  }).join('');
}

/* the dependency line — the point of the whole layer */
function depLine(a,act){
  if(a.tier===4){
    if(!a.feeds){
      return '<div class="dep dep-none"><span class="authored-tag">Authored</span>'
        +'<b>Not represented in the model.</b> No simulation lever corresponds to this action, so the site cannot say what it would change. It is listed because it is real, not because it is measurable here.</div>';
    }
    var lv=LEVERS[a.feeds.replace('lever:','')];
    var raw=SIM_ENGINE.scenarios[act][lv.id];
    var val=lv.id==='charter'?(raw?'in force':'absent'):raw+(lv.unit||'');
    var vals=V3.SC_ORDER.map(function(sc){
      var r=SIM_ENGINE.scenarios[sc][lv.id];
      return '<span'+(sc===act?' class="on"':'')+'>'+V3.SC[sc].short+' <b>'+(lv.id==='charter'?(r?'yes':'no'):r+(lv.unit||''))+'</b></span>';
    }).join('');
    return '<div class="dep dep-lever"><span class="authored-tag">Authored link</span><b>Model lever \u00b7 '+lv.label+'</b> '+lv.desc
      +'<div class="dep-vals">'+vals+'</div>'
      +'<div class="dep-claim">Under '+V3.SC[act].name.toLowerCase()+' this lever sits at <b>'+val+'</b>. This action is part of <em>what makes this future that future</em> \u2014 it does not move the score. The values above are read from the model; deciding that this action corresponds to this lever was a judgement call.</div></div>';
  }
  if(!a.feeds){
    return '<div class="dep dep-none"><span class="authored-tag">Authored</span>'
      +'<b>No route mapped.</b> Nothing in this catalog turns this into policy. The blocker sits at the municipal level, which the catalog does not cover yet.</div>';
  }
  var tgt=bySlug(a.feeds);
  return '<div class="dep dep-feeds"><span class="authored-tag">Authored</span>'
    +'<b>Builds toward</b> <a href="#'+a.feeds+'" data-jump="'+a.feeds+'">'+(tgt?tgt.name:a.feeds)+'</a>'
    +'<div class="dep-claim">Not because it reduces emissions at scale \u2014 because it builds the constituency, precedent or demand that makes that lever politically reachable.</div></div>';
}

function renderActions(){
  var act=V3.scenario.get();
  var list=ALL.filter(function(x){return filter==='all'||filter==='t'+x.a.tier});
  list.sort(function(p,q){return p.a.tier-q.a.tier});
  var out='',lastTier=null;
  list.forEach(function(x){
    if(x.a.tier!==lastTier){
      var sc=scopeOf(x.a.tier);
      out+='<div class="tier-head"><h3>'+sc.label+'</h3><p>'+sc.blurb+'</p></div>';
      lastTier=x.a.tier;
    }
    var st=x.a.scenario[act];
    var rank=window.stratStatusRank?stratStatusRank(st.status):2;
    out+='<div class="action-card" id="'+slug(x.a.name)+'">'
      +'<div class="a-head"><h4>'+x.a.name+'</h4><span class="status s'+rank+'">'+st.status+'</span></div>'
      +'<div class="a-desc">'+x.a.desc+'</div>'
      +'<div class="a-note">'+st.note+'</div>'
      +depLine(x.a,act)
      +'<div class="a-meta"><span style="color:'+CAT_COLORS[x.cat]+'">\u25cf</span>'
      +'<span>cost <b>'+x.a.cost+'</b></span><span>difficulty <b>'+x.a.difficulty+'</b></span>'
      +(x.a.co2?'<span>CO\u2082 <b>'+x.a.co2+'</b></span>':'')
      +'<span>timeline <b>'+x.a.timeline+'</b></span></div></div>';
  });
  if(filter==='all'){
    var gap=STRATEGY_CATALOG.scopeGap;
    out+='<div class="tier-gap"><h3>'+gap.label+' \u2014 not yet covered</h3><p>'+gap.note+'</p></div>';
  }
  document.getElementById('action-cards').innerHTML=out;
  V3.stagger(document.querySelectorAll('.action-card'),10);
}

document.getElementById('cat-filter').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  filter=b.getAttribute('data-f');renderFilter();renderActions();V3.share.sync();
});
/* jumping to the lever an action feeds must not leave it filtered out */
document.getElementById('action-cards').addEventListener('click',function(e){
  var a=e.target.closest('a[data-jump]');if(!a)return;
  e.preventDefault();
  if(filter!=='all'){filter='all';renderFilter();renderActions()}
  var t=document.getElementById(a.getAttribute('data-jump'));
  if(t){t.scrollIntoView({behavior:'smooth',block:'center'});
    t.classList.add('flash');setTimeout(function(){t.classList.remove('flash')},1500);}
});
V3.share.restore();
renderCats();renderFilter();renderActions();
/* deep links from index.html land before the cards exist, so resolve
   ?a=<slug> once after the first render. A query param, not a hash —
   the hash is owned by the scenario store. */
(function(){
  var id=(location.search.match(/[?&]a=([a-z0-9-]+)/)||[])[1];if(!id)return;
  /* Chrome cancels a smooth programmatic scroll started while the document
     is still loading, and html{scroll-behavior:smooth} applies here — so
     wait for load and scroll instantly. */
  function jump(){
    var t=document.getElementById(id);if(!t)return;
    var y=t.getBoundingClientRect().top+window.pageYOffset-(window.innerHeight/2)+(t.offsetHeight/2);
    window.scrollTo({top:Math.max(0,y),behavior:'auto'});
    t.classList.add('flash');setTimeout(function(){t.classList.remove('flash')},1500);
  }
  function arm(){setTimeout(jump,120)}
  if(document.readyState==='complete')arm();else window.addEventListener('load',arm);
})();
V3.scenario.onChange(function(){renderCats();renderActions()});
</script>
</body>
</html>
