{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Same init pattern as viz.html: #cv, W/H from window, append canvas */
const box = document.getElementById('cv');
const W = () => window.innerWidth;
const H = () => window.innerHeight;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setClearColor(0x080810, 1);
renderer.setSize(W(), H());
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
box.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080810);

const camera = new THREE.PerspectiveCamera(50, W() / H(), 0.1, 1000);
camera.position.z = 15;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 8;
controls.maxDistance = 30;

const R = 5;
function latLonToVec3(lat, lon, r = R) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lon + 180) * Math.PI / 180;
  return new THREE.Vector3(-r * Math.sin(phi) * Math.cos(theta), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(theta));
}

/* Simple 3D value noise for digital terrain (deterministic, no texture) */
function hash(x) { x = (x * 374761393) >>> 0; return (x * 668265263) % 1; }
function noise3(x, y, z) {
  const ix = Math.floor(x) & 255;
  const iy = Math.floor(y) & 255;
  const iz = Math.floor(z) & 255;
  const fx = x - Math.floor(x);
  const fy = y - Math.floor(y);
  const fz = z - Math.floor(z);
  const u = fx * fx * (3 - 2 * fx);
  const v = fy * fy * (3 - 2 * fy);
  const w = fz * fz * (3 - 2 * fz);
  const A = hash(ix + iy * 257 + iz * 65537);
  const B = hash(ix + 1 + iy * 257 + iz * 65537);
  const C = hash(ix + (iy + 1) * 257 + iz * 65537);
  const D = hash(ix + 1 + (iy + 1) * 257 + iz * 65537);
  const E = hash(ix + iy * 257 + (iz + 1) * 65537);
  const F = hash(ix + 1 + iy * 257 + (iz + 1) * 65537);
  const G = hash(ix + (iy + 1) * 257 + (iz + 1) * 65537);
  const H = hash(ix + 1 + (iy + 1) * 257 + (iz + 1) * 65537);
  return A * (1 - u) * (1 - v) * (1 - w) + B * u * (1 - v) * (1 - w) + C * (1 - u) * v * (1 - w) + D * u * v * (1 - w) +
    E * (1 - u) * (1 - v) * w + F * u * (1 - v) * w + G * (1 - u) * v * w + H * u * v * w;
}
function fbm(x, y, z, octaves) {
  let v = 0, a = 0.5, f = 1;
  for (let i = 0; i < octaves; i++) {
    v += a * noise3(x * f, y * f, z * f);
    a *= 0.5;
    f *= 2;
  }
  return v;
}

/* Feltron scenario terrain tints (dark, editorial) */
const SCENARIO_TERRAIN = {
  aggressive: { color: 0x0d2a24, emissive: 0x041510, wireframe: 0x1a4a3e },
  moderate:   { color: 0x1a2535, emissive: 0x080c14, wireframe: 0x2a3a52 },
  bau:        { color: 0x2a2418, emissive: 0x0f0d08, wireframe: 0x4a3e28 },
  worst:      { color: 0x2a1818, emissive: 0x140808, wireframe: 0x4a2828 },
};

let terrainMesh = null;
let terrainWire = null;
let oceanMesh = null;
let oceanGrid = null;
let atmoMesh = null;

function buildTerrain(scenarioId, yearVal) {
  const segs = 80;
  const geo = new THREE.SphereGeometry(R, segs, Math.floor(segs / 2));
  const pos = geo.attributes.position;
  const orig = new Float32Array(pos.array.length);
  orig.set(pos.array);
  const LAND_THRESHOLD = 0.42;
  const DISPLACE = 0.12;
  const STEP = 3;
  for (let i = 0; i < pos.count; i++) {
    const x = orig[i * 3];
    const y = orig[i * 3 + 1];
    const z = orig[i * 3 + 2];
    const n = fbm(x * 2.5 + 10, y * 2.5, z * 2.5, 4);
    const land = n > LAND_THRESHOLD;
    const d = land ? (n - LAND_THRESHOLD) / (1 - LAND_THRESHOLD) : 0;
    const stepped = Math.floor(d * STEP) / STEP;
    const displace = land ? (0.02 + stepped * DISPLACE) : 0;
    const nx = x + (x / R) * displace;
    const ny = y + (y / R) * displace;
    const nz = z + (z / R) * displace;
    pos.setXYZ(i, nx, ny, nz);
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  if (terrainMesh) scene.remove(terrainMesh);
  if (terrainWire) scene.remove(terrainWire);
  const meta = SCENARIO_TERRAIN[scenarioId] || SCENARIO_TERRAIN.aggressive;
  const mat = new THREE.MeshPhongMaterial({
    color: meta.color,
    emissive: meta.emissive,
    specular: 0x223344,
    shininess: 6,
    flatShading: true,
  });
  terrainMesh = new THREE.Mesh(geo, mat);
  scene.add(terrainMesh);
  const wireGeo = new THREE.WireframeGeometry(geo);
  terrainWire = new THREE.LineSegments(wireGeo, new THREE.LineBasicMaterial({ color: meta.wireframe, transparent: true, opacity: 0.35 }));
  scene.add(terrainWire);
}

function buildOcean(seaLevelMm, scenarioId) {
  const oceanR = R + (seaLevelMm / 12000) * R;
  if (oceanMesh) scene.remove(oceanMesh);
  if (oceanGrid) scene.remove(oceanGrid);
  const oceanGeo = new THREE.SphereGeometry(oceanR, 48, 24);
  const oceanMat = new THREE.MeshPhongMaterial({
    color: 0x0a2a2a,
    emissive: 0x4ecdc4,
    emissiveIntensity: 0.25,
    transparent: true,
    opacity: 0.4,
    side: THREE.DoubleSide,
    specular: 0x4ecdc4,
    shininess: 80,
  });
  oceanMesh = new THREE.Mesh(oceanGeo, oceanMat);
  scene.add(oceanMesh);
  const gridGeo = new THREE.SphereGeometry(oceanR * 1.001, 24, 12);
  const gridMat = new THREE.MeshBasicMaterial({
    color: 0x4ecdc4,
    wireframe: true,
    transparent: true,
    opacity: 0.6,
  });
  oceanGrid = new THREE.Mesh(gridGeo, gridMat);
  scene.add(oceanGrid);
}

function updateGlobeFromState() {
  const idx = Math.min(Math.max(0, year - 2026), 24);
  const seaLevelMm = GLOBE_DATA[scenario] ? GLOBE_DATA[scenario].seaLevel[idx] : 0;
  buildOcean(seaLevelMm, scenario);
  buildTerrain(scenario, year);
  if (!atmoMesh) {
    const atmoGeo = new THREE.SphereGeometry(R * 1.08, 64, 64);
    const atmoMat = new THREE.MeshBasicMaterial({ color: 0x4ecdc4, transparent: true, opacity: 0.08, side: THREE.BackSide });
    atmoMesh = new THREE.Mesh(atmoGeo, atmoMat);
    scene.add(atmoMesh);
  }
}

scene.add(new THREE.AmbientLight(0x556677, 0.7));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(10, 10, 10);
scene.add(dirLight);

const GEO_DATA = {
  minerals: [
    { name: 'Lithium', lat: -23.6, lon: -68.9, color: 0x14b8a6 },
    { name: 'Cobalt', lat: -11.6, lon: 27.5, color: 0x8b5cf6 },
    { name: 'Copper', lat: -33.4, lon: -70.7, color: 0xe8a838 },
    { name: 'Rare Earths', lat: 30.5, lon: 105.5, color: 0x5da5da },
    { name: 'Nickel', lat: -5.2, lon: 119.5, color: 0x4ecdc4 },
  ],
  datacenters: [
    { name: 'Virginia', lat: 38.9, lon: -77.0, capacity: 1.2 },
    { name: 'Dublin', lat: 53.3, lon: -6.3, capacity: 0.9 },
    { name: 'Frankfurt', lat: 50.1, lon: 8.7, capacity: 0.8 },
    { name: 'Tokyo', lat: 35.7, lon: 139.7, capacity: 0.7 },
    { name: 'Singapore', lat: 1.3, lon: 103.8, capacity: 0.6 },
    { name: 'Sydney', lat: -33.9, lon: 151.2, capacity: 0.4 },
    { name: 'São Paulo', lat: -23.5, lon: -46.6, capacity: 0.3 },
    { name: 'Mumbai', lat: 19.1, lon: 72.9, capacity: 0.5 },
  ],
  energy: [
    { name: 'Solar', lat: 35.0, lon: 115.0, pct: 5.5, color: 0xe8a838 },
    { name: 'Wind', lat: 52.5, lon: 5.0, pct: 7.8, color: 0x06b6d4 },
    { name: 'Hydro', lat: 30.0, lon: 105.0, pct: 14.8, color: 0x5da5da },
    { name: 'Nuclear', lat: 48.9, lon: 2.4, pct: 9.5, color: 0x9b87f5 },
    { name: 'Coal', lat: 39.9, lon: 116.4, pct: 35.2, color: 0x64748b },
    { name: 'Gas', lat: 25.3, lon: 51.5, pct: 22.5, color: 0x94a3b8 },
  ],
  cables: [
    { from: [51.5, -0.1], to: [40.7, -74.0] },
    { from: [35.7, 139.7], to: [37.8, -122.4] },
    { from: [1.3, 103.8], to: [22.3, 114.2] },
    { from: [48.9, 2.4], to: [40.4, -3.7] },
    { from: [-33.9, 151.2], to: [-37.8, 145.0] },
    { from: [-23.5, -46.6], to: [38.9, -77.0] },
  ],
  satellites: [
    { name: 'Starlink', lat: 45, lon: -120, alt: 550 },
    { name: 'OneWeb', lat: 50, lon: 10, alt: 1200 },
    { name: 'ISS', lat: 30, lon: 60, alt: 400 },
    { name: 'GPS', lat: 0, lon: 0, alt: 20200 },
  ],
};

let GLOBE_DATA = {
  aggressive: { seaLevel: [0,3,6,9,12,15,18,21,24,27,30,33,35,37,39,41,43,44,45,46,47,48,48,49,49], biodiversity: [100,99,98,97,97,97,97,98,98,99,100,101,102,103,105,107,109,111,113,115,117,119,121,123,125] },
  moderate: { seaLevel: [0,4,8,13,18,23,28,34,40,46,52,58,64,70,76,82,88,94,100,106,112,118,124,130,136], biodiversity: [100,98,96,94,92,90,88,87,86,85,84,84,84,84,85,85,86,87,88,89,90,91,92,93,94] },
  bau: { seaLevel: [0,5,11,18,26,35,44,54,65,77,89,102,116,130,145,161,177,194,212,230,249,269,289,310,332], biodiversity: [100,97,94,91,88,85,82,79,76,73,71,69,67,65,63,61,60,59,58,57,56,55,54,53,52] },
  worst: { seaLevel: [0,7,16,27,40,56,74,95,119,146,176,210,248,290,336,387,442,502,567,637,712,793,880,973,1072], biodiversity: [100,96,91,86,81,76,71,66,61,56,51,47,43,39,36,33,30,28,26,24,23,22,21,20,19] },
};

const EMISSIONS_HISTORY = [35.2,35.5,36.0,36.6,36.7,34.8,36.3,36.8,36.8,36.8,36.6];

function getScenarioFromHash() {
  const m = (location.hash || '').slice(1).toLowerCase().match(/^(aggressive|moderate|bau|worst)$/);
  return m ? m[1] : 'aggressive';
}
function setScenarioHash(id) { location.hash = id; }

let scenario = getScenarioFromHash();
let year = 2026;
setScenarioHash(scenario);

/* Sync .sc-btn active state to current scenario */
function setActiveScenario(id) {
  document.querySelectorAll('.sc-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector('.sc-btn[data-id="' + id + '"]');
  if (btn) btn.classList.add('active');
}
setActiveScenario(scenario);

/* Globe terrain + ocean built from scenario/year (called after data ready and on scenario/year change) */
updateGlobeFromState();

const layers = {};
['resources', 'datacenters', 'energy', 'cables', 'satellites', 'sealevel', 'emissions', 'biodiversity'].forEach(k => {
  layers[k] = new THREE.Group();
  scene.add(layers[k]);
});

function addMarker(lat, lon, color, size, group) {
  const geo = new THREE.SphereGeometry(size, 8, 8);
  const mat = new THREE.MeshBasicMaterial({ color });
  const m = new THREE.Mesh(geo, mat);
  m.position.copy(latLonToVec3(lat, lon, R + size));
  group.add(m);
}

function addCable(from, to, color, group) {
  const start = latLonToVec3(from[0], from[1], R + 0.01);
  const end = latLonToVec3(to[0], to[1], R + 0.01);
  const curve = new THREE.QuadraticBezierCurve3(
    start,
    new THREE.Vector3().addVectors(start, end).multiplyScalar(0.5).add(new THREE.Vector3(0, 2, 0)),
    end
  );
  const geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(32));
  group.add(new THREE.Line(geo, new THREE.LineBasicMaterial({ color: color || 0xd4622a })));
}

function renderLayers() {
  Object.values(layers).forEach(g => { while (g.children.length) g.remove(g.children[0]); });
  if (layers.resources.visible) GEO_DATA.minerals.forEach(m => addMarker(m.lat, m.lon, m.color, 0.12, layers.resources));
  if (layers.datacenters.visible) GEO_DATA.datacenters.forEach(d => addMarker(d.lat, d.lon, 0x4ecdc4, 0.06 + d.capacity * 0.03, layers.datacenters));
  if (layers.energy.visible) GEO_DATA.energy.forEach(e => addMarker(e.lat, e.lon, e.color, 0.05 + e.pct / 100, layers.energy));
  if (layers.cables.visible) GEO_DATA.cables.forEach(c => addCable(c.from, c.to, 0xd4622a, layers.cables));
  if (layers.satellites.visible) GEO_DATA.satellites.forEach(s => addMarker(s.lat, s.lon, 0xe8a838, 0.04 + (s.alt / 42000) * 0.5, layers.satellites));
  if (layers.sealevel.visible) {
    const idx = Math.min(Math.max(0, year - 2026), 24);
    const val = GLOBE_DATA[scenario].seaLevel[idx] || 0;
    const intensity = Math.min(val / 400, 1);
    const color = new THREE.Color().setHSL(0.6 - intensity * 0.6, 1, 0.5);
    for (let i = 0; i < 8; i++) {
      const phi = (i / 8) * Math.PI * 2;
      const geo = new THREE.RingGeometry(R + 0.002, R + 0.02, 32);
      const mat = new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
      const ring = new THREE.Mesh(geo, mat);
      ring.rotation.x = -Math.PI / 2;
      ring.rotation.z = phi;
      ring.position.copy(latLonToVec3(0, (phi * 180 / Math.PI), 0).multiplyScalar(0.3));
      layers.sealevel.add(ring);
    }
  }
  if (layers.emissions.visible) {
    const idx = Math.min(Math.max(0, year - 2015), 10);
    const gt = EMISSIONS_HISTORY[idx] || 36.8;
    const scale = gt / 40;
    [30, 60, 90, 120, 150].forEach((lat, i) => {
      addMarker(lat - 60, i * 72, 0xd4622a, 0.03 + scale * 0.08, layers.emissions);
      addMarker(-lat + 60, i * 72 + 36, 0xd4622a, 0.03 + scale * 0.08, layers.emissions);
    });
  }
  if (layers.biodiversity.visible) {
    const idx = Math.min(Math.max(0, year - 2026), 24);
    const bio = GLOBE_DATA[scenario].biodiversity[idx] || 100;
    const color = new THREE.Color().setHSL((bio / 125) * 0.35, 1, 0.5);
    [[-3,-60],[22,114],[70,30],[55,105],[-25,115]].forEach(([lat, lon]) => addMarker(lat, lon, color.getHex(), 0.06 + (bio / 100) * 0.04, layers.biodiversity));
  }
}

/* Scenario buttons: same pattern as viz — .sc-btn and data-id */
document.querySelectorAll('.sc-btn').forEach(b => {
  b.addEventListener('click', () => {
    scenario = b.dataset.id;
    setScenarioHash(scenario);
    setActiveScenario(scenario);
    updateGlobeFromState();
    renderLayers();
  });
});

/* Layer buttons: multi-toggle — click to turn on, click again to turn off */
const activeLayers = new Set(['sealevel']);
function syncLayerVisibility() {
  Object.keys(layers).forEach(k => { layers[k].visible = activeLayers.has(k); });
  document.querySelectorAll('.layer-btn').forEach(btn => {
    btn.classList.toggle('active', activeLayers.has(btn.dataset.layer));
  });
}
syncLayerVisibility();
document.querySelectorAll('.layer-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const layer = btn.dataset.layer;
    if (activeLayers.has(layer)) activeLayers.delete(layer);
    else activeLayers.add(layer);
    syncLayerVisibility();
    renderLayers();
  });
});

/* Year slider */
const yrSlider = document.getElementById('yr-slider');
const yrVal = document.getElementById('yr-val');
yrSlider.addEventListener('input', () => {
  year = parseInt(yrSlider.value, 10);
  yrVal.textContent = year;
  updateGlobeFromState();
  renderLayers();
});

/* Play button (optional: step year on interval) */
let playInterval = null;
document.getElementById('play-btn').addEventListener('click', () => {
  if (playInterval) {
    clearInterval(playInterval);
    playInterval = null;
    document.getElementById('play-btn').textContent = '\u9654 Play';
    return;
  }
  document.getElementById('play-btn').textContent = '\u275A\u275A Pause';
  playInterval = setInterval(() => {
    year = Math.min(2050, year + 1);
    yrSlider.value = year;
    yrVal.textContent = year;
    updateGlobeFromState();
    renderLayers();
    if (year >= 2050) {
      clearInterval(playInterval);
      playInterval = null;
      document.getElementById('play-btn').textContent = '\u9654 Play';
    }
  }, 400);
});

fetch((window.location.origin || '') + '/data/climate.json')
  .then(r => r.ok ? r.json() : null)
  .then(climate => {
    if (climate && climate.scenarios) {
      climate.scenarios.forEach(s => {
        if (GLOBE_DATA[s.id]) {
          GLOBE_DATA[s.id].seaLevel = s.seaLevel || GLOBE_DATA[s.id].seaLevel;
          GLOBE_DATA[s.id].biodiversity = s.biodiversity || GLOBE_DATA[s.id].biodiversity;
        }
      });
    }
    renderLayers();
  })
  .catch(() => renderLayers());

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = W() / H();
  camera.updateProjectionMatrix();
  renderer.setSize(W(), H());
});
</script>
</body>
</html>
