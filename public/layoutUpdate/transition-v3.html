<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transition — Design v3</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/v3.css?v=20260815h">
</head>
<body>
<div id="app"></div>
<script src="js/shared.js?v=20260815h"></script>
<script src="js/v3-data.js?v=20260815h"></script>
<script src="https://cdn.jsdelivr.net/npm/motion@12.23.26/dist/motion.js"></script>
<script src="js/v3.js?v=20260815h"></script>
<script>
V3.boot({deck:{sys:'transition',context:'Work, reskilling, and the income bridge'}});
var T=V3DATA.transition;

V3.systemPage({
  sys:'transition',
  tagline:'What happens to work decides what happens to everything.',
  lead:'Four labor-market vitals as automation rewrites the economy: poverty, reskilling, job placement, employment. The scenarios differ on one question — when a job disappears, is there a funded bridge to the next one, or a gap people fall through? The bridge calculator below prices six real transitions.',
  today:43,
  proj:T.TRANS_SCORES,
  metrics:T.indicators.map(function(meta){
    return {label:meta.label,unit:meta.unit,dir:meta.dir,dec:meta.dec,
      notes:T.CARD_DESCS[meta.id]||null,
      data:T.D[meta.id]};
  }),
  narratives:T.narratives,
  crossKey:'transition'
});

/* ── the income bridge — the page's signature interactive ── */
var narSection=document.querySelector('#sys-nar').closest('.section');
narSection.insertAdjacentHTML('beforebegin',
  '<section class="section"><div class="col">'
  +'<div class="section-head"><div><h2 class="title-2">The income bridge, priced</h2>'
  +'<p class="lead">Six real career transitions out of automated work. Pick one; the numbers show what the move costs, what it pays, and how much of the burden the chosen future’s civic dividend absorbs. This is the difference between the scenarios, in one worker’s budget.</p></div></div>'
  +'<div id="bridge"></div></div></section>');
V3.bridges('#bridge',T.bridges,T.DIV_RATE);
</script>
</body>
</html>
